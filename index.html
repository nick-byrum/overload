<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Overload</title>
<style>
:root{--bg:#0b0b0d;--s1:#141418;--s2:#1c1c22;--s3:#24242c;--bd:#26262e;--tx:#ededf2;--mu:#8b8b98;--dim:#5a5a66;--ac:#f2f2f5;--acd:rgba(255,255,255,.08);--pr:#ffc94d;--red:#ff6161;--amb:#ffb547;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none}
body.timing{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:8px 16px 24px}
h1{font-size:28px;font-weight:750;letter-spacing:-.025em;margin:14px 0 2px}
h2{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin:26px 0 10px}
h3{font-size:17px;margin:0;font-weight:650}
.sub{color:var(--mu);font-size:13.5px}
.dim{color:var(--dim)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.tap{cursor:pointer}.tap:active{background:var(--s2)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.gap{height:10px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.btn{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);color:#0b0b0d;border-color:var(--ac)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:none;border-color:transparent;color:var(--mu)}
.btn.line{background:none}
.btn.danger{color:var(--red)}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu);font-size:20px;flex:none}
.ib:active{background:var(--s2)}
input,select{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
input:focus,select:focus{border-color:var(--ac)}
input::placeholder{color:var(--dim)}
input[type=date]{color-scheme:dark}
label.f{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px;font-weight:600}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,13,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--dim);padding:6px 8px;min-width:58px;border-radius:12px}
nav button.on{color:var(--ac)}
nav svg{width:23px;height:23px}
/* segmented */
.seg{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;color:var(--mu);font-weight:650;font-size:13px}
.seg button.on{background:var(--s3);color:var(--tx)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;background:var(--s2);color:var(--mu);border:1px solid var(--bd);font-weight:600}
.pill.ac{background:var(--acd);color:var(--ac);border-color:transparent}
/* muscles */
.mgrid{display:flex;flex-wrap:wrap;gap:7px}
.mchip{padding:8px 12px;border-radius:99px;border:1px solid var(--bd);font-size:13px;color:var(--mu);font-weight:600;background:var(--s2)}
.mchip.p{background:var(--ac);color:#0b0b0d;border-color:var(--ac)}
.mchip.s{background:var(--acd);color:var(--ac);border-color:rgba(255,255,255,.45)}
/* session */
.en{font-weight:700;font-size:16.5px}
.last{font-size:12.5px;color:var(--mu);margin-top:8px}
.sug{font-size:13px;margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--s2);color:var(--mu);display:flex;gap:7px;align-items:flex-start}
.sug svg{width:15px;height:15px;flex:none;margin-top:1px}
.sug.up{background:rgba(255,255,255,.09);color:var(--tx)}
.sug.down,.sug.stall{background:rgba(255,181,71,.1);color:var(--amb)}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 58px 44px;gap:6px;align-items:center;margin-top:6px}
.setrow.h{margin-top:12px;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;font-weight:700;text-align:center}
.setrow .n{color:var(--dim);font-weight:700;text-align:center;font-size:13px}
.setrow input,.setrow select{padding:10px 4px;text-align:center;font-weight:650;font-size:16px}
.setrow select{background-image:none;padding-right:4px;text-align-last:center}
.chk{width:44px;height:44px;border-radius:11px;background:var(--s2);border:1px solid var(--bd);display:grid;place-items:center;color:var(--dim)}
.chk svg{width:20px;height:20px}
.chk.on{background:var(--ac);color:#0b0b0d;border-color:var(--ac)}
.setrow.done input,.setrow.done select{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.shead{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:4px 0 10px;margin:0 -2px}
/* week */
.wkhead{display:flex;align-items:center;gap:6px;margin:14px 0 12px}
.wkhead h1{margin:0;font-size:22px;flex:1;text-align:center}
.day{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--s1);border:1px solid var(--bd);margin-bottom:8px;min-height:62px;transition:background .15s,border-color .15s}
.day.today{border-color:rgba(255,255,255,.45)}
.day.over{background:var(--acd);border-color:var(--ac)}
.day .dl{width:40px;flex:none;text-align:center}
.dl b{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.dl span{font-size:20px;font-weight:750}
.day.today .dl b,.day.today .dl span{color:var(--ac)}
.chips{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:38px}
.chip{padding:9px 13px;border-radius:11px;background:var(--s3);border:1px solid #33333d;font-weight:650;font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip.done{background:rgba(255,255,255,.1);color:var(--tx);border-color:transparent;touch-action:auto;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chip.done svg{width:14px;height:14px}
.chip.missed{opacity:.45}
.chip.dragging{opacity:.25}
.dghost{position:fixed;pointer-events:none;z-index:60;transform:translate(-50%,-60%) scale(1.06);box-shadow:0 12px 30px rgba(0,0,0,.7);border-color:var(--ac)!important}
.add{width:36px;height:36px;border-radius:10px;border:1px dashed #3a3a45;color:var(--dim);font-size:20px;flex:none;display:grid;place-items:center}
.rest{font-size:13px;color:var(--dim)}
/* volume */
.vol{display:grid;grid-template-columns:92px 1fr 52px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.vol .v{text-align:right;font-weight:700}
.vol .v small{color:var(--dim);font-weight:500}
.track{position:relative;height:10px;background:var(--s2);border-radius:5px;overflow:hidden}
.track .pl{position:absolute;top:0;bottom:0;left:0;background:#34343f;border-radius:5px}
.track .dn{position:absolute;top:0;bottom:0;left:0;background:var(--ac);border-radius:5px}
.track .mk{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.22)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px;font-weight:750;letter-spacing:-.01em}
.stat span{font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;font-weight:650}
.stat b.up{color:var(--pr)}.stat b.dn{color:var(--amb)}
/* chart */
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:#24242c;stroke-width:1}
.chart .lbl{fill:var(--dim);font-size:9.5px}
.chart .ln{fill:none;stroke:var(--ac);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:url(#ga);stroke:none}
.chart .dt{fill:var(--ac)}
.chart .dt2{fill:#5f5f6c}
.chart .vl{fill:var(--tx);font-size:11px;font-weight:700}
.empty{padding:28px 10px;text-align:center;color:var(--dim);font-size:14px}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--bd)}
.list .it:last-child{border-bottom:0}
.pr{color:var(--pr);font-size:11px;font-weight:800;letter-spacing:.06em}
/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--s1);border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .sheet-bg{opacity:1}.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.full .sheet{top:0;border-radius:0;max-height:none;border:0;padding-top:calc(8px + env(safe-area-inset-top))}
.grab{width:38px;height:4px;border-radius:2px;background:#3a3a45;margin:4px auto 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 12px;border-radius:12px;font-weight:600;font-size:15.5px}
.opt:active{background:var(--s2)}
.opt.danger{color:var(--red)}
.opt .sub{font-weight:500}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.days7 button{padding:12px 0;border-radius:10px;background:var(--s2);border:1px solid var(--bd);font-weight:650;font-size:13px}
.days7 button.on{border-color:var(--ac);color:var(--ac)}
.titem{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.tgrid label{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700;display:block;margin-bottom:4px;text-align:center}
.tgrid input{text-align:center;padding:9px 4px;background:var(--s1)}
.titem select{background-color:var(--s1)}
/* timer */
#timer{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--s2);border:1px solid var(--bd);border-radius:16px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:6px;z-index:19;box-shadow:0 12px 34px rgba(0,0,0,.55);overflow:hidden}
#timer[hidden]{display:none}
#timer .t{font-size:24px;font-weight:800;min-width:72px;letter-spacing:-.02em}
#timer .lab{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:700;flex:1}
#timer .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);transition:width .25s linear}
#timer.end{border-color:var(--ac)}#timer.end .t{color:var(--ac)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--s3);border:1px solid #3a3a45;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hero{background:linear-gradient(160deg,#1f1f25,var(--s1) 65%);border-color:#30303a}
.muted-note{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.5}
.steps li{margin:6px 0;color:var(--mu)}
.steps b{color:var(--tx)}
.exnote{font-size:12.5px;color:var(--mu);margin-top:6px;padding-left:9px;border-left:2px solid #3a3a45;white-space:pre-wrap}
textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;width:100%;outline:none;resize:vertical;min-height:72px}
textarea:focus{border-color:var(--ac)}
.chip.cardio{background:none;border:1px dashed #44444f;color:var(--mu);font-weight:600;font-size:13px;touch-action:auto;cursor:pointer;padding:8px 11px}
.tchips{display:flex;flex-wrap:wrap;gap:7px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.cal-h{text-align:center;font-size:11px;color:var(--dim);font-weight:700;padding-bottom:2px}
.cal-d{aspect-ratio:1;border-radius:12px;background:var(--s1);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:650;font-size:14px}
.cal-d.lift{background:var(--s3);border-color:#3a3a45}
.cal-d.t{border-color:#fff}
.cal-d.fut{opacity:.45}
.cal-d i{display:flex;gap:3px;height:6px}
.cal-d b{width:6px;height:6px;border-radius:50%;display:block}
.cal-d .dl{background:#fff}.cal-d .dc{border:1.5px solid var(--mu)}.cal-d .dp{background:var(--pr)}
</style>
</head>
<body>
<main id="view"></main>
<div id="timer" hidden>
  <div class="t" id="tT">0:00</div><div class="lab" id="tL">Rest</div>
  <button class="btn sm" data-act="tAdd" data-v="-15">−15</button>
  <button class="btn sm" data-act="tAdd" data-v="15">+15</button>
  <button class="btn sm" data-act="tSkip">Skip</button>
  <div class="pb" id="tP"></div>
</div>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
'use strict';
/* ================= data ================= */
const KEY='overload.v1';
const MUSCLES=['Chest','Lats','Upper Back','Front Delts','Side Delts','Rear Delts','Biceps','Triceps','Forearms','Abs','Quads','Hamstrings','Glutes','Adductors','Calves','Lower Back'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function blank(){return{v:1,exercises:[],templates:[],basePlan:[[],[],[],[],[],[],[]],weeks:{},sessions:[],cardio:[],bw:{},settings:{rest:120},lastBackup:null}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
S=Object.assign(blank(),S);S.settings=Object.assign(blank().settings,S.settings);
let saveT;
let gT;
function save(now){clearTimeout(saveT);const w=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — storage full')}};now?w():saveT=setTimeout(w,250);if(S.settings.gOn&&gReady()){clearTimeout(gT);gT=setTimeout(gSync,8000)}}
addEventListener('pagehide',()=>save(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>dk(new Date());
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return dk(d)};
const monday=k=>{const d=parse(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dk(d)};
const dowOf=k=>(parse(k).getDay()+6)%7;
const fmtD=(k,o)=>parse(k).toLocaleDateString(undefined,o||{weekday:'short',month:'short',day:'numeric'});
const fmtW=w=>{w=+w;return Number.isInteger(w)?String(w):(Math.round(w*10)/10).toString()};
const r1=x=>Math.round(x*10)/10;
// Reps to failure = reps done + reps in reserve (RIR-based RPE, Zourdos 2016; lifters are typically within ~1 rep).
const rtf=(r,rir)=>(+r||0)+(+rir||0);
// Est. 1RM = mean of Epley (1985) and Brzycki (1993). Both are most accurate at <=10 reps to failure (LeSuer 1997; Reynolds 2006).
const e1=(w,r,rir)=>{w=+w;const n=rtf(r,rir);if(n<=1)return w;const ep=w*(1+n/30),br=n<37?w*36/(37-n):ep;return(ep+br)/2};
const ex=id=>S.exercises.find(e=>e.id===id);
const exList=()=>S.exercises.filter(e=>!e.archived).sort((a,b)=>a.name.localeCompare(b.name));
const tpl=id=>S.templates.find(t=>t.id===id);
const active=()=>S.sessions.find(s=>!s.finishedAt);
const doneSets=en=>en.log.filter(x=>x.done&&x.w!==''&&+x.r>0);
const pl=(n,w)=>n+' '+w+(n===1?'':'s');
const mmss=s=>Math.floor(s/60)+':'+pad(Math.floor(s%60));
const IC={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>',
 week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
 prog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>',
 bw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9.5a4 4 0 0 1 6 0M12 9.5l1.5-2"/></svg>',
 lib:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
 eq:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg>',
 warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>',
 left:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 right:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 dots:'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ================= training logic ================= */
// All logged appearances of an exercise, oldest first.
function history(exId,excludeId){
  const out=[];
  for(const s of S.sessions){
    if(s.id===excludeId||!s.finishedAt)continue;
    for(const en of s.entries){
      if(en.exId!==exId)continue;
      const d=doneSets(en);
      if(d.length)out.push({date:s.date,t:s.startedAt,sess:s,entry:en,done:d});

  else if(bestReps<tg.repMin)Object.assign(res,{kind:'down',w:top,text:`Under ${tg.repMin} reps last time — stay at ${fmtW(top)} or drop to ${fmtW(Math.max(0,top-inc))} lb`});

/* ================= chart ================= */
function chart(series,opt){
  const W=340,H=180,P={l:36,r:12,t:16,b:22};
  const all=series.flatMap(s=>s.pts).filter(p=>p[1]!=null&&isFinite(p[1]));
  if(!all.length)return `<div class="empty">Not enough data yet</div>`;
  let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0]));
  if(x1-x0<864e5){x0-=864e5*3;x1+=864e5*3}
  let y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  const pd=(y1-y0)*.18||Math.max(1,y1*.04);y0-=pd;y1+=pd;
  const X=x=>P.l+(x-x0)/(x1-x0)*(W-P.l-P.r),Y=y=>P.t+(1-(y-y0)/(y1-y0))*(H-P.t-P.b);
  let g=`<defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>`;
  for(let i=0;i<4;i++){const v=y0+(y1-y0)*(i+.5)/4,yy=Y(v);g+=`<line class="g" x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}"/><text class="lbl" x="${P.l-6}" y="${yy+3}" text-anchor="end">${Math.round(v)}</text>`}
  const xl=[x0,(x0+x1)/2,x1];xl.forEach((x,i)=>g+=`<text class="lbl" x="${X(x)}" y="${H-6}" text-anchor="${['start','middle','end'][i]}">${new Date(x).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>`);
  series.forEach(s=>{
    const p=s.pts.filter(q=>q[1]!=null&&isFinite(q[1]));if(!p.length)return;
    if(s.type==='line'){
      const d=p.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join('');
      if(series.length===1&&p.length>1)g+=`<path class="ar" d="${d}L${X(p[p.length-1][0]).toFixed(1)} ${H-P.b}L${X(p[0][0]).toFixed(1)} ${H-P.b}Z"/>`;
      g+=`<path class="ln" d="${d}"/>`;
      if(p.length<40)p.forEach(q=>g+=`<circle class="dt" cx="${X(q[0])}" cy="${Y(q[1])}" r="2.6"/>`);
      const lq=p[p.length-1];g+=`<circle class="dt" cx="${X(lq[0])}" cy="${Y(lq[1])}" r="4.5"/><text class="vl" x="${Math.min(X(lq[0]),W-P.r)}" y="${Y(lq[1])-9}" text-anchor="end">${fmtW(r1(lq[1]))}</text>`;
    }else p.forEach(q=>g+=`<circle class="dt2" cx="${X(q[0])}" cy="${Y(q[1])}" r="2.6"/>`);
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ================= sheets ================= */
function sheet(html,mount,full){
  const w=document.createElement('div');w.className='sheet-wrap'+(full?' full':'');
  w.innerHTML=`<div class="sheet-bg"></div><div class="sheet">${full?'':'<div class="grab"></div>'}${html}</div>`;
  document.body.appendChild(w);requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('open')));
  const close=()=>{w.classList.remove('open');setTimeout(()=>w.remove(),260)};
  w.querySelector('.sheet-bg').onclick=close;
  mount&&mount(w.querySelector('.sheet'),close);

}

/* ---------- swap + notes ---------- */
function swapEntry(s,ei,nid){
  const en=s.entries[ei];if(nid===en.exId)return;
  const done=en.log.filter(x=>x.done),left=en.log.length-done.length;
  const tg={sets:Math.max(1,left||en.sets),repMin:en.repMin,repMax:en.repMax,rir:en.rir};
  const ne=makeEntry(nid,tg,s.id);
  if(s.finishedAt)ne.log.forEach(x=>x.w='');
  if(done.length){en.log=done;en.sets=done.length;s.entries.splice(ei+1,0,ne)} // keep sets already done on the old lift
  else s.entries.splice(ei,1,ne);
  save();rerender();toast('Swapped to '+ex(nid).name);
}
function editNotes(exId){
  const e=ex(exId);if(!e)return;
  sheet(`<h3>${esc(e.name)}</h3><label class="f">Notes — seat height, grip, cues</label><textarea data-k="t" placeholder="e.g. Seat 4, pins at 6, elbows tucked">${esc(e.notes||'')}</textarea><div class="gap"></div><button class="btn pri block" data-k="ok">Save</button>`,(el,close)=>{
    const t=el.querySelector('[data-k=t]');setTimeout(()=>t.focus(),280);
    el.querySelector('[data-k=ok]').onclick=()=>{e.notes=t.value.trim();save();close();rerender()};
  });
}

function startSession(tid){
  if(active()){toast('Finish your current workout first');UI.tab='today';render();return}
  const t=tid?tpl(tid):null;
  const s={id:uid(),date:today(),templateId:tid||null,name:t?t.name:'Workout',startedAt:Date.now(),finishedAt:null,entries:[]};
  if(t)t.items.forEach(it=>{if(ex(it.exId)&&!ex(it.exId).archived)s.entries.push(makeEntry(it.exId,it,s.id))});
  S.sessions.push(s);save();UI.tab='today';screen&&screen.close();render();scrollTo(0,0);
}
function finishSession(){
  const s=active();if(!s)return;
  const undone=s.entries.reduce((a,en)=>a+en.log.filter(x=>!x.done).length,0);
  const go=()=>{
    s.entries.forEach(en=>en.log=en.log.filter(x=>x.done&&x.w!==''&&+x.r>0));
    s.entries=s.entries.filter(en=>en.log.length);
    if(!s.entries.length){S.sessions=S.sessions.filter(x=>x!==s);T=null;save();render();return toast('Nothing logged — workout discarded')}
    // PRs vs all earlier history
    s.prs=[];
    s.entries.forEach(en=>{const h=history(en.exId,s.id);const b=bestE1(en.log);if(h.length&&b>Math.max(...h.map(x=>bestE1(x.done)))+0.01)s.prs.push(en.exId)});
    s.finishedAt=Date.now();T=null;save(true);render();gTouch();
    const sets=s.entries.reduce((a,en)=>a+en.log.length,0),mins=Math.round((s.finishedAt-s.startedAt)/60000);
    const vol={};s.entries.forEach(en=>addVol(vol,en.exId,en.log.length));
    sheet(`<h3>Workout done</h3><div class="stats"><div class="stat"><span>Time</span><b>${mins}m</b></div><div class="stat"><span>Sets</span><b>${sets}</b></div><div class="stat"><span>PRs</span><b class="${s.prs.length?'up':''}">${s.prs.length}</b></div></div>
    ${s.prs.length?`<div class="sug up" style="color:var(--pr);background:rgba(255,201,77,.1)">${IC.up}<span>New est. 1RM on ${esc(s.prs.map(id=>ex(id).name).join(', '))}</span></div>`:''}
    <div class="sub" style="margin-top:12px">${Object.entries(vol).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`${m} ${r1(v)}`).join(' · ')}</div>
    <div class="gap"></div><div class="gap"></div><button class="btn pri block" data-k="ok">Close</button>`,(el,close)=>el.querySelector('[data-k=ok]').onclick=close);
  };
  if(undone)confirmSheet(`${undone} unchecked set${undone>1?'s':''} won’t be saved. Finish anyway?`,'Finish',go,false);else go();
}

let drag=null;

  const c=e.target.closest('.chip[data-drag]');if(!c)return;
  drag={el:c,x:e.clientX,y:e.clientY,on:false,tid:c.dataset.tid,from:+c.dataset.day,idx:+c.dataset.idx};
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;
    drag.on=true;drag.g=drag.el.cloneNode(true);drag.g.classList.add('dghost');document.body.appendChild(drag.g);drag.el.classList.add('dragging');navigator.vibrate&&navigator.vibrate(8)}
  e.preventDefault();
  drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
  document.querySelectorAll('.day.over').forEach(x=>x.classList.remove('over'));
  const t=document.elementFromPoint(e.clientX,e.clientY),day=t&&t.closest('[data-dropday]');
  if(day)day.classList.add('over');drag.to=day?+day.dataset.dropday:null;
  // auto-scroll near edges
  if(e.clientY<70)scrollBy(0,-8);else if(e.clientY>innerHeight-110)scrollBy(0,8);
},{passive:false});
function endDrag(cancel){
  if(!drag)return;const d=drag;drag=null;
  document.querySelectorAll('.day.over').forEach(x=>x.classList.remove('over'));
  if(d.g)d.g.remove();d.el.classList.remove('dragging');
  if(cancel)return;
  if(!d.on)return chipMenu(d);
  if(d.to==null||d.to===d.from)return;
  const P=editablePlan(UI.wkMode,UI.wk);P[d.from].splice(d.idx,1);P[d.to].push(d.tid);save();render();

  const tp=tpl(d.tid);if(!tp)return;
  sheet(`<h3>${esc(tp.name)}</h3><div class="sub">${DOW[d.from]} · ${tp.items.length} exercises</div><div class="gap"></div>
  <button class="btn pri block" data-k="start">Start now</button>
  <label class="f">Move to</label><div class="days7">${DOW.map((n,i)=>`<button data-day="${i}" class="${i===d.from?'on':''}">${n}</button>`).join('')}</div>
  <div class="gap"></div><button class="opt" data-k="edit">Edit workout</button><button class="opt danger" data-k="rm">Remove from ${DOW[d.from]}</button>`,(el,close)=>{
    el.querySelector('[data-k=start]').onclick=()=>{close();startSession(d.tid)};
    el.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const to=+b.dataset.day;close();if(to===d.from)return;const P=editablePlan(UI.wkMode,UI.wk);P[d.from].splice(d.idx,1);P[to].push(d.tid);save();render()});
    el.querySelector('[data-k=edit]').onclick=()=>{close();editTemplate(d.tid)};
    el.querySelector('[data-k=rm]').onclick=()=>{close();editablePlan(UI.wkMode,UI.wk)[d.from].splice(d.idx,1);save();render()};
  });
}

/* ================= rest timer ================= */
let T=null,actx=null;
function startTimer(sec){sec=sec||S.settings.rest;T={end:Date.now()+sec*1000,dur:sec,fired:false};try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}tickTimer()}
function beep(){try{if(!actx)return;[0,.22].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.18);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2)})}catch(e){}}
function tickTimer(){
  const el=$('#timer');
  if(!T||!active()){el.hidden=true;document.body.classList.remove('timing');return}
  const left=(T.end-Date.now())/1000;
  if(left<=0&&!T.fired){T.fired=true;navigator.vibrate&&navigator.vibrate([250,120,250]);beep()}
  if(left<-6){T=null;return tickTimer()}
  el.hidden=false;document.body.classList.add('timing');
  el.classList.toggle('end',left<=0);
  $('#tT').textContent=left>0?mmss(Math.ceil(left)):'Go';
  $('#tL').textContent=left>0?'Rest':'Next set';
  $('#tP').style.width=Math.max(0,Math.min(100,left/T.dur*100))+'%';
}
setInterval(()=>{tickTimer();const a=active(),el=$('#elapsed');if(a&&el)el.textContent=mmss((Date.now()-a.startedAt)/1000)},250);

/* ================= google drive sync ================= */
const G={tok:null,exp:0,client:null,busy:false,pending:false,after:null,err:null};
try{const t=JSON.parse(localStorage.getItem('overload.gtok')||'null');if(t&&t.exp>Date.now()){G.tok=t.tok;G.exp=t.exp}}catch(e){}
function gReady(){return !!G.tok&&G.exp>Date.now()+60e3}
function gKeep(){return{gcid:S.settings.gcid,gOn:S.settings.gOn,gFile:S.settings.gFile,gLast:S.settings.gLast}}
function gBoot(){
  if(!S.settings.gcid)return;
  const init=()=>{try{G.client=google.accounts.oauth2.initTokenClient({client_id:S.settings.gcid,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{if(r.error){toast('Google sign-in failed');return}
      G.tok=r.access_token;G.exp=Date.now()+(+r.expires_in||3600)*1000;G.err=null;
      try{localStorage.setItem('overload.gtok',JSON.stringify({tok:G.tok,exp:G.exp}))}catch(e){}
      const first=!S.settings.gOn;S.settings.gOn=true;save(true);
      const f=G.after;G.after=null;if(f)f();else gSync(first);render()},
    error_callback:()=>toast('Google sign-in closed')})}catch(e){G.err='Bad client ID'}};
  if(window.google&&google.accounts&&google.accounts.oauth2)return init();
  if(document.getElementById('gsi'))return;
  const sc=document.createElement('script');sc.id='gsi';sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=init;sc.onerror=()=>{G.err='Offline — can’t reach Google';sc.remove()};document.head.appendChild(sc);
}
function gAuth(prompt,after){if(!G.client){gBoot();return toast('Google sign-in is loading — tap again in a second')}G.after=after||null;G.client.requestAccessToken({prompt})}
// Called from taps (finish workout, save weight): refreshes the token if needed, which Google only allows during a tap.
function gTouch(){if(!S.settings.gOn)return;if(gReady())gSync();else if(G.client&&navigator.onLine)gAuth('')}
async function gApi(url,opt={}){
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+G.tok}});
  if(r.status===401||r.status===403){G.tok=null;G.exp=0;throw new Error('Google sign-in expired — tap Sync now')}
  return r;
}
async function gFindFile(){
  if(S.settings.gFile)return S.settings.gFile;
  const q=encodeURIComponent("name='overload-backup.json' and trashed=false");
  const r=await gApi(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id)`);
  if(!r.ok)throw new Error('Drive error '+r.status);
  const j=await r.json();return j.files&&j.files[0]?j.files[0].id:null;
}
async function gSync(loud){
  if(!S.settings.gOn||!gReady()||!navigator.onLine)return;
  if(G.busy){G.pending=true;return}
  G.busy=true;clearTimeout(gT);
  try{
    const body=JSON.stringify(S);let id=await gFindFile();
    if(id){const r=await gApi(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
      if(r.status===404){S.settings.gFile=null;id=null}else if(!r.ok)throw new Error('Drive error '+r.status)}
    if(!id){const b='ovl'+Date.now();
      const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:'overload-backup.json',mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
      const r=await gApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp});
      if(!r.ok)throw new Error('Drive error '+r.status);id=(await r.json()).id}
    S.settings.gFile=id;S.settings.gLast=Date.now();G.err=null;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(loud)toast('Synced to Google Drive');
  }catch(e){G.err=e.message;if(loud)toast(e.message)}
  finally{G.busy=false;if(G.pending){G.pending=false;setTimeout(gSync,1500)}if(UI.tab==='lib'&&UI.lib==='data')render()}
}
async function gRestore(){
  try{
    const id=await gFindFile();if(!id)return toast('No Overload backup in your Drive yet');
    const r=await gApi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);if(!r.ok)throw new Error('Drive error '+r.status);
    const d=await r.json();if(!d||!Array.isArray(d.sessions))throw new Error('Drive file isn’t an Overload backup');
    const n=d.sessions.filter(x=>x.finishedAt).length;
    confirmSheet(`Replace the data on this phone with your Drive backup (${pl(n,'workout')})?`,'Replace',()=>{const keep=gKeep();keep.gFile=id;S=Object.assign(blank(),d);S.settings=Object.assign(blank().settings,S.settings,keep);save(true);render();toast('Restored from Drive')});
  }catch(e){toast(e.message)}
}
function driveCard(){
  const st=S.settings;
  let h=`<div class="card"><div class="row"><b class="sp">Google Drive sync</b>${st.gOn?'<span class="pill ac">On</span>':''}</div>`;
  if(!st.gcid)return h+`<div class="sub">One-time setup: paste your Google client ID (ends in .apps.googleusercontent.com).</div><div class="gap"></div><div class="row"><input id="gcid" placeholder="Client ID" autocomplete="off"><button class="btn pri" data-act="gSaveId">Save</button></div></div>`;
  if(!st.gOn)return h+`<div class="sub">Backs up automatically to <b>overload-backup.json</b> in your Drive.</div><div class="gap"></div><button class="btn pri block" data-act="gConnect">Connect Google Drive</button><button class="btn ghost block sm" data-act="gEditId" style="margin-top:6px">Change client ID</button>${G.err?`<div class="muted-note" style="color:var(--amb)">${esc(G.err)}</div>`:''}</div>`;
  h+=`<div class="sub">Auto-saves to <b>overload-backup.json</b> after workouts, weigh-ins and edits. ${st.gLast?`Last synced ${new Date(st.gLast).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}.`:'Not synced yet.'}</div>`;
  if(G.err)h+=`<div class="muted-note" style="color:var(--amb)">${esc(G.err)}</div>`;
  h+=`<div class="gap"></div><div class="row"><button class="btn sp" data-act="gSyncNow">${G.busy?'Syncing…':'Sync now'}</button><button class="btn sp" data-act="gRestore">Restore from Drive</button></div><button class="btn ghost block sm danger" data-act="gOff" style="margin-top:6px">Disconnect</button></div>`;
  return h;
}

/* ================= boot ================= */
if(active())UI.tab='today';
render();
gBoot();if(S.settings.gOn&&gReady())setTimeout(gSync,2500);
addEventListener('online',()=>{if(S.settings.gOn&&gReady())gSync()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
