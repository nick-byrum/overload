<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Apex</title>
<style>
@font-face{font-family:Cond;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Cond;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Cond;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
:root{
 --bg:#07080a;--s1:#101114;--s2:#17191d;--s3:#1f2227;--s4:#2a2e35;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
 --tx:#f3f4f6;--mu:#a4a9b3;--dim:#80868f;
 --ac:#4fd8ff;--acr:79,216,255;--on:#00131a;
 --pr:#ffc83d;--red:#ff5a5a;--amb:#ffb03a;--blue:#b79cff;
 --cut:170,140,255;--bulk:255,140,60;--keep:160,160,175;
 --r:18px;--D:Cond,"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20% -20% auto;height:60vh;background:radial-gradient(60% 60% at 70% 0%,rgba(var(--acr),.10),transparent 70%);pointer-events:none;z-index:-1}
body.timing{padding-bottom:calc(178px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:8px 16px 24px}
h1{font:800 40px/0.95 var(--D);letter-spacing:.005em;text-transform:uppercase;margin:18px 0 4px}
h2{font:700 15px/1 var(--D);text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:28px 0 10px;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
h3{font:700 22px/1.05 var(--D);text-transform:uppercase;letter-spacing:.01em;margin:0}
.num{font-family:var(--D);font-weight:800;letter-spacing:.01em}
.sub{color:var(--mu);font-size:13.5px}
.dim{color:var(--dim)}
.ac{color:var(--ac)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.tap{cursor:pointer}.tap:active{background:var(--s2)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.gap{height:10px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.btn{background:var(--s3);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:44px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);color:var(--on);border-color:transparent}
.btn.big{font:800 20px var(--D);text-transform:uppercase;letter-spacing:.06em;padding:14px 22px;border-radius:16px;min-height:54px}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px;min-height:34px}
.btn.ghost{background:none;border-color:transparent;color:var(--mu)}
.btn.line{background:none;border-color:var(--bd2)}
.btn.danger{color:var(--red)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mu);font-size:20px;flex:none}
.ib:active{background:var(--s2)}
input,select{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none;min-height:44px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
input:focus,select:focus,textarea:focus{border-color:rgba(var(--acr),.7)}
input::placeholder,textarea::placeholder{color:var(--dim)}
input[type=date]{color-scheme:dark}
label.f{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px;font-weight:600}
textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;width:100%;outline:none;resize:vertical;min-height:72px}
/* nav */
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;background:rgba(18,19,23,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--bd2);border-radius:24px;display:flex;justify-content:space-around;padding:6px;z-index:20;box-shadow:0 14px 40px rgba(0,0,0,.6)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px var(--D);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:7px 2px 6px;border-radius:18px;transition:background .15s,color .15s}
nav button.on{color:var(--on);background:var(--ac)}
nav svg{width:22px;height:22px}
/* segmented */
.seg{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:11px;color:var(--mu);font:700 14px var(--D);letter-spacing:.08em;text-transform:uppercase;min-height:36px}
.seg button.on{background:var(--s4);color:var(--tx)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font:700 12px var(--D);letter-spacing:.08em;text-transform:uppercase;background:var(--s2);color:var(--mu);border:1px solid var(--bd)}
.pill.on{background:rgba(var(--acr),.14);color:var(--ac);border-color:transparent}
.pill.prp{background:rgba(255,200,61,.14);color:var(--pr);border-color:transparent}
.pill.cut{background:rgba(var(--cut),.14);color:rgb(var(--cut));border-color:transparent}
.pill.bulk{background:rgba(var(--bulk),.14);color:rgb(var(--bulk));border-color:transparent}
.pill.keep{background:rgba(var(--keep),.14);color:rgb(var(--keep));border-color:transparent}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px;margin:14px 0 10px;background:linear-gradient(150deg,rgba(var(--acr),.20),rgba(var(--acr),.03) 45%,transparent 70%),var(--s1);border:1px solid rgba(var(--acr),.25)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(var(--acr),.08)}
.hero .kick{font:700 13px var(--D);letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
.hero .ttl{font:800 52px/.9 var(--D);text-transform:uppercase;margin:6px 0 8px;letter-spacing:.005em;position:relative;z-index:1}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;position:relative;z-index:1}
.lastlist{position:relative;z-index:1;margin:4px 0 14px;display:grid;gap:4px}
.lastlist div{display:flex;gap:10px;font-size:13px;color:var(--mu)}
.lastlist b{color:var(--tx);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:6px;flex-wrap:wrap}
/* muscles */
.mgrid{display:flex;flex-wrap:wrap;gap:7px}
.mchip{padding:8px 12px;border-radius:99px;border:1px solid var(--bd);font-size:13px;color:var(--mu);font-weight:600;background:var(--s2);min-height:36px}
.mchip.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
.mchip.s{background:none;color:var(--tx);border:1.5px dashed rgba(var(--acr),.7)}
/* session */
.en{font:700 22px/1.05 var(--D);text-transform:uppercase;letter-spacing:.01em}
.tgt{font:600 14px var(--D);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-top:3px}
.sug{font-size:13.5px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--s2);color:var(--mu);display:flex;gap:9px;align-items:flex-start;line-height:1.35}
.sug svg{width:16px;height:16px;flex:none;margin-top:1px}
.sug b{color:var(--tx)}
.sug.up{background:rgba(var(--acr),.1);color:var(--tx)}.sug.up svg{color:var(--ac)}
.sug.down,.sug.warn{background:rgba(255,176,58,.09);color:#ffd08a}
.sug.cut{background:rgba(var(--cut),.1);color:#dcd0ff}
.sug.deload{background:rgba(var(--cut),.1);color:#dcd0ff}
.plates{font:600 13px var(--D);letter-spacing:.06em;color:var(--mu);margin-top:6px;text-transform:uppercase}
.plates b{color:var(--tx)}
.chip-s{font:700 11px var(--D);letter-spacing:.12em;text-transform:uppercase;color:var(--amb);margin-top:8px;display:flex;gap:5px;align-items:center}
.chip-s.cut{color:rgb(var(--cut))}
.setrow{display:grid;grid-template-columns:28px 62px minmax(0,1fr) minmax(0,1fr) 52px 46px;gap:6px;align-items:center;margin-top:7px;border-radius:13px;transition:background .2s}
.setrow.h{margin-top:14px;font:700 11px var(--D);color:var(--dim);text-transform:uppercase;letter-spacing:.12em;text-align:center}
.setrow .n{color:var(--mu);font:800 17px var(--D);text-align:center;height:46px;border-radius:11px}
.setrow .n:active{background:var(--s2)}
.setrow .prev{font:600 14px var(--D);color:var(--dim);text-align:center;height:46px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.setrow .prev:active{background:var(--s2);color:var(--tx)}
.setrow.st-wu .n,.setrow.st-d .n,.setrow.st-m .n,.setrow.st-lp .n{color:var(--tx);background:var(--s3);font-size:14px}
.setrow.st-wu .n{color:var(--blue)}
.setrow.st-lp .n{color:var(--ac)}
.setrow.st-wu input,.setrow.st-wu select{opacity:.72}
.setrow input,.setrow select{padding:8px 2px;text-align:center;font:800 22px var(--D);min-height:46px;letter-spacing:.02em}
.setrow select{background-image:none;padding-right:2px;text-align-last:center;font-size:19px}
.chk{width:46px;height:46px;border-radius:13px;background:var(--s2);border:1px solid var(--bd2);display:grid;place-items:center;color:var(--dim);transition:transform .15s}
.chk svg{width:22px;height:22px}
.chk.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.chk.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.setrow.done input,.setrow.done select{background:rgba(var(--acr),.09);border-color:transparent;color:var(--tx)}
.setrow.isPR input{background:rgba(255,200,61,.14)!important;color:var(--pr)!important}
.setrow.isPR .chk{background:var(--pr);border-color:var(--pr)}
.hint{font-size:11px;color:var(--dim)}
input.need{border-color:var(--ac)!important;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.fold{padding:12px 14px}.fold .chk{width:34px;height:34px;border-radius:10px;flex:none}.fold .chk svg{width:16px;height:16px}
.fold .en{font-size:19px}
.ss{border-left:3px solid var(--ac)}
.sslab{font:800 12px var(--D);letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin-bottom:6px}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu);margin-top:12px;min-height:36px}
.tog input{width:22px;height:22px;min-height:0;accent-color:var(--ac);-webkit-appearance:auto;appearance:auto;flex:none}
.stick{position:sticky;top:calc(-8px - env(safe-area-inset-top));background:var(--s1);z-index:3;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.shead{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 78%,transparent);padding:4px 0 12px;margin:0 -2px}
.prog-bar{height:4px;border-radius:2px;background:var(--s3);overflow:hidden;margin-top:10px}.prog-bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.pain{color:var(--red);font:700 11px var(--D);letter-spacing:.12em}
/* week */
.wkhead{display:flex;align-items:center;gap:6px;margin:14px 0 12px}
.wkhead h3{margin:0;font-size:24px;flex:1;text-align:center}
.day{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--s1);border:1px solid var(--bd);margin-bottom:8px;min-height:64px;transition:background .15s,border-color .15s}
.day.today{border-color:rgba(var(--acr),.55);box-shadow:inset 0 0 0 1px rgba(var(--acr),.15)}
.day.over{background:rgba(var(--acr),.08);border-color:var(--ac)}
.day.dl{background:repeating-linear-gradient(135deg,var(--s1) 0 10px,rgba(var(--cut),.05) 10px 20px)}
.day .dlab{width:40px;flex:none;text-align:center}
.dlab b{display:block;font:700 12px var(--D);color:var(--mu);text-transform:uppercase;letter-spacing:.12em}
.dlab span{font:800 26px/1 var(--D)}
.day.today .dlab b,.day.today .dlab span{color:var(--ac)}
.chips{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px}
.chip{padding:9px 13px;border-radius:12px;background:var(--s3);border:1px solid var(--bd2);font:700 15px var(--D);letter-spacing:.05em;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip.done{background:var(--ac);color:var(--on);border-color:transparent;touch-action:auto;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chip.done svg{width:14px;height:14px}
.chip.missed{opacity:.5;text-decoration:line-through;text-decoration-thickness:2px}
.chip.skipped{opacity:.55;border-style:dashed;background:none}
.chip.dragging{opacity:.25}
.dghost{position:fixed;pointer-events:none;z-index:60;transform:translate(-50%,-60%) scale(1.06);box-shadow:0 12px 30px rgba(0,0,0,.7);border-color:var(--ac)!important}
.add{width:38px;height:38px;border-radius:11px;border:1px dashed var(--bd2);color:var(--dim);font-size:20px;flex:none;display:grid;place-items:center}
.rest{font:600 14px var(--D);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.chip.cardio{background:none;border:1px dashed var(--bd2);color:var(--mu);font-size:13px;touch-action:auto;cursor:pointer;padding:8px 11px}
/* muscle board */
.mboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mt{border-radius:14px;padding:9px 8px 8px;background:var(--s2);border:1px solid var(--bd);position:relative;overflow:hidden;min-height:68px}
.mt .v{font:800 28px/1 var(--D);display:block}
.mt .v small{font-size:14px;color:var(--dim);font-weight:700}
.mt .m{font:700 11px/1.1 var(--D);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);display:block;margin-top:4px}
.mt .f{position:absolute;left:0;bottom:0;height:4px;background:var(--dim)}
.mt.lo .f{background:var(--amb)}.mt.ok{border-color:rgba(var(--acr),.35)}.mt.ok .f{background:var(--ac)}.mt.ok .v{color:var(--ac)}.mt.hi .f{background:var(--red)}.mt.hi .v{color:var(--red)}
.mt.none{opacity:.45}
.mt .star{position:absolute;right:7px;top:6px;color:var(--pr);font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin:10px 0 2px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:12px}
.stat b{display:block;font:800 30px/1 var(--D);letter-spacing:.01em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b small{font-size:15px;color:var(--mu)}
.stat span{font:700 11px var(--D);color:var(--mu);text-transform:uppercase;letter-spacing:.12em}
.stat b.up{color:var(--ac)}.stat b.dn{color:var(--amb)}.stat b.gold{color:var(--pr)}
.stat.big{grid-column:span 3;display:flex;align-items:flex-end;gap:14px}
.stat.big b{font-size:64px}
/* chart */
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart .g{stroke:rgba(255,255,255,.06);stroke-width:1}
.chart .lbl{fill:var(--dim);font:600 10.5px Inter,sans-serif}
.chart .ln{fill:none;stroke:var(--ac);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1.5;stroke-dasharray:3 4}
.chart .dt{fill:var(--ac)}.chart .dt2{fill:rgba(255,255,255,.28)}.chart .dpr{fill:var(--pr);stroke:var(--bg);stroke-width:2}
.chart .vl{fill:var(--tx);font:800 15px var(--D)}
.chart .band-cut{fill:rgba(var(--cut),.07)}.chart .band-bulk{fill:rgba(var(--bulk),.06)}.chart .band-keep{fill:rgba(var(--keep),.04)}
.chart .bl{font:700 10px var(--D);letter-spacing:.1em}
.chart .bl-cut{fill:rgba(var(--cut),.7)}.chart .bl-bulk{fill:rgba(var(--bulk),.75)}.chart .bl-keep{fill:rgba(var(--keep),.6)}
.chart .cur{stroke:rgba(255,255,255,.35);stroke-width:1}
.tipbox{font:700 13px var(--D);letter-spacing:.04em;text-align:center;color:var(--mu);min-height:20px;margin-top:2px}
.tipbox b{color:var(--tx)}
.empty{padding:28px 10px;text-align:center;color:var(--dim);font-size:14px}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--bd)}
.list .it:last-child{border-bottom:0}
.prt{color:var(--pr);font:800 12px var(--D);letter-spacing:.1em}
/* lift board */
.lb{display:flex;align-items:center;gap:12px;padding:12px 14px}
.lb .nm{font:700 18px/1.1 var(--D);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .vv{font:800 26px/1 var(--D);text-align:right}
.lb .dd{font:700 13px var(--D);letter-spacing:.04em;text-align:right}
.lb svg{flex:none}
/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--s2)}
.heat i.l1{background:rgba(var(--acr),.35)}.heat i.l2{background:rgba(var(--acr),.65)}.heat i.l3{background:var(--ac)}.heat i.pr{background:var(--pr)}.heat i.fut{background:transparent}.heat i.c{background:rgba(255,255,255,.12)}
.streak{display:flex;gap:18px;margin-bottom:12px}
.streak b{display:block;font:800 34px/1 var(--D)}
.streak span{font:700 11px var(--D);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.66);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--s1);border:1px solid var(--bd2);border-bottom:0;border-radius:26px 26px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .sheet-bg{opacity:1}.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.full .sheet{top:0;border-radius:0;max-height:none;border:0;padding-top:calc(8px + env(safe-area-inset-top))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--s4);margin:4px auto 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 12px;border-radius:13px;font-weight:600;font-size:15.5px;min-height:48px}
.opt:active{background:var(--s2)}
.opt.danger{color:var(--red)}
.opt .sub{font-weight:500}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.days7 button{padding:12px 0;border-radius:11px;background:var(--s2);border:1px solid var(--bd);font:700 14px var(--D);letter-spacing:.06em;text-transform:uppercase}
.days7 button.on{border-color:var(--ac);color:var(--ac)}

function onField(e){

  if(t.dataset.sdeload&&e.type==='change'){const s=getSess(t.dataset.sdeload);if(s){s.deload=t.checked;computePRs(s);save();toast(s.deload?'Marked as deload':'Counted as a normal session')}return}

/* ================= charts ================= */
const CH={};let chN=0;
function chart(series,opt){
  const W=340,H=200,P={l:34,r:12,t:18,b:22},id='c'+(++chN);
  const all=series.flatMap(s=>s.pts).filter(p=>p[1]!=null&&isFinite(p[1]));
  if(!all.length)return `<div class="empty">Not enough data yet</div>`;
  let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0]));
  if(x1-x0<864e5){x0-=864e5*3;x1+=864e5*3}
  let y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  const pd=(y1-y0)*.16||Math.max(1,y1*.04);y0-=pd;y1+=pd;
  const X=x=>P.l+(x-x0)/(x1-x0)*(W-P.l-P.r),Y=y=>P.t+(1-(y-y0)/(y1-y0))*(H-P.t-P.b);
  let g=`<defs><linearGradient id="ga${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".22"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>`;
  (opt.bands||[]).forEach(b=>{const a=Math.max(P.l,X(parse(b.a).getTime())),z=Math.min(W-P.r,X(parse(b.b).getTime()+864e5));if(z-a<1)return;g+=`<rect class="band-${b.type}" x="${a.toFixed(1)}" y="${P.t}" width="${(z-a).toFixed(1)}" height="${H-P.t-P.b}"/>`;if(z-a>34)g+=`<text class="bl bl-${b.type}" x="${(a+4).toFixed(1)}" y="${P.t+10}">${PHASES[b.type].toUpperCase()}</text>`});
  const tick=(y1-y0)<8;
  for(let i=0;i<4;i++){const v=y0+(y1-y0)*(i+.5)/4,yy=Y(v);g+=`<line class="g" x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}"/><text class="lbl" x="${P.l-6}" y="${yy+3}" text-anchor="end">${tick?r1(v):Math.round(v)}</text>`}
  const yrs=new Date(x0).getFullYear()!==new Date(x1).getFullYear()||new Date(x1).getFullYear()!==new Date().getFullYear();
  [x0,(x0+x1)/2,x1].forEach((x,i)=>{const d=new Date(x);g+=`<text class="lbl" x="${X(x)}" y="${H-6}" text-anchor="${['start','middle','end'][i]}">${d.toLocaleDateString(undefined,{month:'short',day:yrs?undefined:'numeric'})}${yrs?" '"+String(d.getFullYear()).slice(2):''}</text>`});
  const tipPts=[];
  series.forEach(s=>{
    const p=s.pts.filter(q=>q[1]!=null&&isFinite(q[1]));if(!p.length)return;
    if(s.type==='line'){
      const d=p.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join('');
      if(p.length>1)g+=`<path fill="url(#ga${id})" d="${d}L${X(p[p.length-1][0]).toFixed(1)} ${H-P.b}L${X(p[0][0]).toFixed(1)} ${H-P.b}Z"/>`;
      g+=`<path class="ln" d="${d}"/>`;
      const lq=p[p.length-1];g+=`<circle class="dt" cx="${X(lq[0])}" cy="${Y(lq[1])}" r="4.5"/><text class="vl" x="${Math.min(X(lq[0])-8,W-P.r-8)}" y="${Math.max(P.t+12,Y(lq[1])-10)}" text-anchor="end">${fmtW(lq[1]>=100?Math.round(lq[1]):r1(lq[1]))}</text>`;
    }else if(s.type==='pr')p.forEach(q=>g+=`<circle class="dpr" cx="${X(q[0])}" cy="${Y(q[1])}" r="4.5"/>`);
    else{p.forEach(q=>{g+=`<circle class="dt2" cx="${X(q[0])}" cy="${Y(q[1])}" r="${p.length>120?1.8:2.6}"/>`;if(q[2])tipPts.push([X(q[0]),Y(q[1]),q[2],q[1]])})}
  });
  if(opt.tip&&tipPts.length){CH[id]=tipPts;g+=`<line class="cur" id="${id}l" x1="0" x2="0" y1="${P.t}" y2="${H-P.b}" visibility="hidden"/><circle id="${id}d" r="5" fill="#fff" visibility="hidden"/>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" data-ch="${opt.tip?id:''}">${g}</svg>${opt.tip?`<div class="tipbox" id="${id}t">Touch the chart to inspect</div>`:''}`;
}
function chartTip(e){
  const svg=e.target.closest&&e.target.closest('svg[data-ch]');if(!svg||!svg.dataset.ch)return;const id=svg.dataset.ch,pts=CH[id];if(!pts)return;
  const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*340;let best=pts[0];pts.forEach(p=>{if(Math.abs(p[0]-x)<Math.abs(best[0]-x))best=p});
  const l=document.getElementById(id+'l'),d=document.getElementById(id+'d'),t=document.getElementById(id+'t');
  l.setAttribute('x1',best[0]);l.setAttribute('x2',best[0]);l.setAttribute('visibility','visible');d.setAttribute('cx',best[0]);d.setAttribute('cy',best[1]);d.setAttribute('visibility','visible');
  t.innerHTML=`<b>${fmtW(r1(best[3]))}</b> · ${esc(best[2])}`;
}
document.addEventListener('pointerdown',chartTip);document.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')chartTip(e)});

/* ================= sheets ================= */
function sheet(html,mount,full){
  const w=document.createElement('div');w.className='sheet-wrap'+(full?' full':'');
  w.innerHTML=`<div class="sheet-bg"></div><div class="sheet">${full?'':'<div class="grab"></div>'}${html}</div>`;
  document.body.appendChild(w);requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('open')));
  const close=()=>{w.classList.remove('open');setTimeout(()=>w.remove(),280)};
  w.querySelector('.sheet-bg').onclick=close;
  mount&&mount(w.querySelector('.sheet'),close);
  return close;
}
function confirmSheet(msg,ok,fn,danger=true){

    el.querySelector('[data-k=ok]').onclick=()=>{close();fn()};el.querySelector('[data-k=no]').onclick=close;});

function pickExercise(fn,o={}){
  const pref=(o.prefer||[]).map(ex).filter(e=>e&&!e.archived);
  const draw=q=>{const l=exList().filter(e=>e.name.toLowerCase().includes(q.toLowerCase())&&!pref.includes(e)&&!(o.exclude||[]).includes(e.id));
    return (q?'':pref.map(e=>`<button class="opt" data-k="${e.id}"><span class="sp">${esc(e.name)}<div class="sub" style="color:var(--ac)">Alternate</div></span></button>`).join(''))+(l.map(e=>`<button class="opt" data-k="${e.id}"><span class="sp">${esc(e.name)}<div class="sub">${esc((e.primary||[]).join(', '))}</div></span></button>`).join('')||`<div class="empty">No matches</div>`)};
  sheet(`<h3>${esc(o.title||'Add exercise')}</h3><div class="gap"></div><input placeholder="Search" data-k2="q"><div data-k2="l" style="margin-top:6px">${draw('')}</div><button class="btn line block" data-k2="new" style="margin-top:8px">+ New exercise</button>`,(el,close)=>{

    el.querySelector('[data-k2=new]').onclick=()=>{close();editExercise(null,id=>fn(id))};
  });
}

function swapEntry(s,ei,nid){
  const en=s.entries[ei];if(nid===en.exId)return;
  const done=en.log.filter(x=>x.done),left=en.log.filter(x=>!x.done&&isWork(x)).length;
  const tg={sets:Math.max(1,left||en.sets),repMin:en.repMin,repMax:en.repMax,rir:en.rirBase??en.rir,lastRir:en.lastRir??''};
  const ne=makeEntry(nid,tg,s.id,s.date,s.deload);
  if(s.finishedAt)ne.log.forEach(x=>x.w='');
  if(done.length){en.log=done;en.sets=done.filter(isWork).length||1;s.entries.splice(ei+1,0,ne)}

  save();rerender();toast('Swapped to '+ex(nid).name);
}

/* ---------- photos (IndexedDB, phone only) ---------- */
let PDB=null;
function pdb(){return PDB||(PDB=new Promise((ok,no)=>{try{const r=indexedDB.open('overload-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}))}
async function photoPut(k,blob){const db=await pdb();return new Promise((ok,no)=>{const tx=db.transaction('p','readwrite');tx.objectStore('p').put(blob,k);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
async function photoGet(k){const db=await pdb();return new Promise(ok=>{const r=db.transaction('p').objectStore('p').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}
function photoDates(){return Object.keys(S.photos||{}).filter(d=>(S.photos[d]||[]).length).sort().reverse()}
async function shrink(file){
  const img=await createImageBitmap(file),sc=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(ok=>c.toBlob(ok,'image/jpeg',.8));
}
const urls=[];
async function paintPhotos(root){
  for(const im of(root||document).querySelectorAll('img[data-ph]')){const b=await photoGet(im.dataset.ph).catch(()=>null);if(b){const u=URL.createObjectURL(b);urls.push(u);im.src=u;im.hidden=false}}
}

function finishSession(){

    // Keep every ticked set with reps. A blank weight is valid on bodyweight lifts.
    s.entries.forEach(en=>{en.log=en.log.filter(x=>x.done&&okW(x,en.exId)&&+x.r>0);en.log.forEach(x=>delete x.pr)});
    s.entries=s.entries.filter(en=>en.log.length);

    computePRs(s);

}

const G={tok:null,exp:0,client:null,busy:false,pending:false,after:null,err:null};

function gKeep(){return{gcid:S.settings.gcid,gOn:S.settings.gOn,gFile:S.settings.gFile,gLast:S.settings.gLast}}
function gBoot(){
  if(!S.settings.gcid)return;

  after(Pl,'Low Row',it(rdf,2,10,15));
  after(L,'Bulgarian Split Squat',it(slc,2,8,10));
  after(G,'Leg Extension (BFR)',it(hs,2,6,10));
  after(G,'Copenhagen Plank',it(llc,2,8,10));
  sets(L,'Calf Raise',3);sets(G,'Calf Raise',3);
  sets(U,'DB Lateral Raise',3);sets(P,'Cable Lateral Raise',3);
  sets(G,'Copenhagen Plank',3);
  S.seedv=2;save(true);
}
